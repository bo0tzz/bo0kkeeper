<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bo0kkeeper</title>
    %sveltekit.head%
    <script>
      // Theme bootstrap to prevent FOUC. @immich/ui reads `immich-ui-theme` from localStorage.
      try {
        const stored = localStorage.getItem('immich-ui-theme');
        const theme = stored || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch {
        // localStorage unavailable; fall through to default light theme.
      }
    </script>
  </head>
  <body>
    <div>%sveltekit.body%</div>
  </body>
</html>
