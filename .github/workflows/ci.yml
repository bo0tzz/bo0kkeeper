name: ci

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: immich-app/devtools/actions/use-mise@cf6e190bacde3d7bda59372a786b36ac7d01536a # use-mise-action-v2.0.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter bo0kkeeper format
      - run: pnpm --filter web format

  server-lint:
    name: server / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: immich-app/devtools/actions/use-mise@cf6e190bacde3d7bda59372a786b36ac7d01536a # use-mise-action-v2.0.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter bo0kkeeper lint

  server-check:
    name: server / typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: immich-app/devtools/actions/use-mise@cf6e190bacde3d7bda59372a786b36ac7d01536a # use-mise-action-v2.0.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter bo0kkeeper check

  server-unit:
    name: server / unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: immich-app/devtools/actions/use-mise@cf6e190bacde3d7bda59372a786b36ac7d01536a # use-mise-action-v2.0.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter bo0kkeeper test --run

  server-medium:
    name: server / medium tests
    runs-on: ubuntu-latest
    # Medium tests spin Postgres via testcontainers. GitHub runners ship
    # Docker pre-installed; no `services:` block needed.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: immich-app/devtools/actions/use-mise@cf6e190bacde3d7bda59372a786b36ac7d01536a # use-mise-action-v2.0.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter bo0kkeeper test:medium

  server-e2e:
    name: server / e2e tests
    runs-on: ubuntu-latest
    # Same testcontainers path as the medium suite — boots a Postgres via
    # Docker, then stands up a real Nest app + the in-process fake OIDC IDP
    # for the auth-flow spec. Catches JWKS / cookie-scoping / AuthGuard
    # regressions that the medium suite can't see because it mocks auth.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: immich-app/devtools/actions/use-mise@cf6e190bacde3d7bda59372a786b36ac7d01536a # use-mise-action-v2.0.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter bo0kkeeper test:e2e

  knip:
    name: knip
    runs-on: ubuntu-latest
    # Flags unused files, deps, exports, and types across every workspace.
    # Catches dead-code drift between prunes (bin scripts, speculative DTOs,
    # orphaned svelte services) before it piles up.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: immich-app/devtools/actions/use-mise@cf6e190bacde3d7bda59372a786b36ac7d01536a # use-mise-action-v2.0.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec knip

  web-lint:
    name: web / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: immich-app/devtools/actions/use-mise@cf6e190bacde3d7bda59372a786b36ac7d01536a # use-mise-action-v2.0.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint

  web-check:
    name: web / typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: immich-app/devtools/actions/use-mise@cf6e190bacde3d7bda59372a786b36ac7d01536a # use-mise-action-v2.0.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web check

  web-build:
    name: web / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: immich-app/devtools/actions/use-mise@cf6e190bacde3d7bda59372a786b36ac7d01536a # use-mise-action-v2.0.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build

  upgrade-smoke:
    name: server / upgrade smoke
    runs-on: ubuntu-latest
    # Catches the class of bug where main works fine and HEAD works fine on a
    # fresh DB, but the transition main → HEAD breaks (e.g. pg-boss skipping
    # a schema version, a forward-only Kysely migration that won't replay).
    # Boots main's boot-check first to build the prior schema state, then
    # boots HEAD's against the same DB.
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE_NAME: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: immich-app/devtools/actions/use-mise@cf6e190bacde3d7bda59372a786b36ac7d01536a # use-mise-action-v2.0.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Phase 1 — bring DB to main's state
        run: |
          git worktree add /tmp/main-worktree origin/main
          cd /tmp/main-worktree
          pnpm install --frozen-lockfile
          pnpm --filter bo0kkeeper build
          # Skip if main predates boot:check (bootstrap PR). After this PR
          # lands, every subsequent PR exercises the real upgrade path.
          if [ -f server/dist/bin/boot-check.js ]; then
            pnpm --filter bo0kkeeper boot:check
          else
            echo "::warning ::main lacks boot:check; skipping phase 1 (bootstrap)"
          fi

      - name: Phase 2 — replay HEAD's migrations on top
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter bo0kkeeper build
          pnpm --filter bo0kkeeper boot:check

  image:
    runs-on: ubuntu-latest
    needs: [format, server-lint, server-check, server-unit, server-medium, server-e2e, upgrade-smoke, web-lint, web-check, web-build, knip]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Push on anything that isn't a PR: main pushes (main / sha-* / latest)
      # and published releases (the :X.Y.Z semver tag). PRs build only.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/bo0tzz/bo0kkeeper
          # Each rule self-enables by event: branch/sha/latest fire on the main
          # push; semver fires only when the ref is a release tag (vX.Y.Z).
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # APP_VERSION is what /api/system/info and the startup log report.
          # metadata-action's `outputs.version` is the primary tag picked by
          # the tag rules above: a semver string for release events, the
          # branch name for main pushes, the short SHA for PR builds.
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
