[tools]
node = "24"
pnpm = "10"
typst = "latest"

# Local dev env (DB, OIDC, secrets). Gitignored — see .gitignore.
[env]
_.file = ".env"

[tasks.install]
run = "pnpm install"
description = "Install all workspace dependencies"

[tasks.dev]
run = "docker compose -f ./docker/docker-compose.dev.yml up --remove-orphans"
description = "Start dev services (Postgres, etc.)"

[tasks."dev-down"]
run = "docker compose -f ./docker/docker-compose.dev.yml down --remove-orphans"
description = "Stop dev services"

[tasks."build-server"]
run = "pnpm --filter bo0kkeeper build"
description = "Build the NestJS server"

[tasks."build-web"]
run = "pnpm --filter web build"
description = "Build the SvelteKit web app"

[tasks.build]
run = [
  { task = "build-server" },
  { task = "build-web" },
]
description = "Build everything"

[tasks."test-server"]
run = "pnpm --filter bo0kkeeper test"
description = "Server unit tests"

[tasks."test-medium"]
run = "pnpm --filter bo0kkeeper test:medium"
description = "Server integration tests (testcontainers Postgres)"

[tasks."test-e2e"]
run = "pnpm --filter bo0kkeeper test:e2e"
description = "Server e2e tests — boots a real Nest app + fake OIDC IDP, drives the auth flow"

[tasks."test-web"]
run = "pnpm --filter web test"
description = "Web unit tests"

[tasks.test]
run = [
  { task = "test-server" },
  { task = "test-medium" },
  { task = "test-e2e" },
  { task = "test-web" },
]
description = "Run all tests (unit + integration + e2e + web)"

[tasks."lint-server"]
run = "pnpm --filter bo0kkeeper lint"

[tasks."lint-web"]
run = "pnpm --filter web lint"

[tasks.lint]
run = [
  { task = "lint-server" },
  { task = "lint-web" },
]
description = "Lint everything"

[tasks.format]
run = "pnpm --recursive --parallel format"
description = "Check formatting"

[tasks."format-fix"]
run = "pnpm --recursive --parallel format:fix"
description = "Apply formatting"

[tasks.check]
run = "pnpm --recursive --parallel check"
description = "Type-check everything"

[tasks."open-api"]
run = "./open-api/bin/generate-open-api.sh"
description = "Regenerate the OpenAPI spec and rebuild the typed SDK"

[tasks.smoke]
run = "bash scripts/smoke-dev.sh"
description = "Smoke-test the running dev stack: db, backend, vite proxy, auth wiring"

[tasks.seed]
run = "pnpm --filter bo0kkeeper exec tsx src/bin/seed-fake-data.ts"
description = "Seed the dev DB with synthetic clients/invoices/expenses for UI demos"

[tasks.checklist]
run = [
  { task = "format" },
  { task = "lint" },
  { task = "check" },
  { task = "test" },
]
description = "Full pre-commit-style check"

[tasks.clean]
run = [
  { task = "dev-down" },
  "rm -rf node_modules server/node_modules web/node_modules",
]
description = "Tear down dev services and remove node_modules"
