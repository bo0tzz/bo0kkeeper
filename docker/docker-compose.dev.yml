name: bo0kkeeper-dev

services:
  database:
    container_name: bo0kkeeper_postgres
    image: postgres:18@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_DB: ${DB_DATABASE_NAME:-bo0kkeeper}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      # Postgres 18+ wants the parent dir mounted (data lives in a major-version subdir).
      - postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    shm_size: 128mb
    healthcheck:
      test: pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      interval: 5s
      timeout: 5s
      retries: 10

  # Local paperless-ngx instance for testing the expense ingest webhook end-to-end.
  # First boot creates an admin user from the env vars below; once you can log
  # in at http://localhost:8000, set up a workflow:
  #   Settings → Workflows → New
  #     - Trigger type: "Document Updated"  (NOT "Document Added" — that one fires
  #       before paperless's auto-matching task has applied tags/correspondent, so
  #       our tag-gate would see an empty tag set and drop the doc. See upstream
  #       issue #12117. "Document Updated" fires after auto-match settles, AND on
  #       any later manual tagging — both paths reach us.)
  #     - Advanced Filters → Any Tags: pick the same tag(s) configured in
  #       Settings → Paperless tags → "Expense ingestion tag-gate" (default
  #       Business, Bills). Without this filter the webhook fires on EVERY doc
  #       update; bo0kkeeper would still drop non-matching docs at the gate, but
  #       you'd flood the audit log with no-op events.
  #     - Action: "Webhook" → POST http://host.docker.internal:2283/api/webhooks/paperless
  #       Webhook headers: Authorization = "Bearer <PAPERLESS_WEBHOOK_TOKEN from .env>"
  #       Webhook params (the body — keep "Use parameters for webhook body" + JSON on).
  #       Values are Jinja2 templates — MUST use double braces or paperless
  #       ships the literal string. paperless v2.20.x has no id-shaped
  #       placeholder (`doc_id` is dev-branch only, and `doc_pk` /
  #       `created_date` were never valid), so we take `{{doc_url}}` and
  #       peel the id off the URL server-side.
  #         document_url  → {{doc_url}}
  #         correspondent → {{correspondent}}
  #         created       → {{created}}
  #       (document_url is the only required field; the others are nice-to-haves
  #       for pre-fill. We re-fetch the doc via REST anyway to read live tags,
  #       since there's no `doc_tags` placeholder.)
  paperless-broker:
    container_name: bo0kkeeper_paperless_broker
    image: docker.io/library/redis:8@sha256:234c902a2db49461a129e2d4aeff85b28cf20187ed274a67f6e50995fa713c7b
    restart: unless-stopped
    volumes:
      - paperless-redis:/data

  paperless:
    container_name: bo0kkeeper_paperless
    image: ghcr.io/paperless-ngx/paperless-ngx:latest@sha256:6c86cad803970ea782683a8e80e7403444c5bf3cf70de63b4d3c8e87500db92f
    restart: unless-stopped
    depends_on:
      - paperless-broker
    ports:
      - "8000:8000"
    extra_hosts:
      # So the paperless container can reach the bo0kkeeper backend on the host
      # to POST workflow webhooks.
      - "host.docker.internal:host-gateway"
    volumes:
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
      - paperless-export:/usr/src/paperless/export
      - paperless-consume:/usr/src/paperless/consume
    environment:
      PAPERLESS_REDIS: redis://paperless-broker:6379
      PAPERLESS_DBENGINE: sqlite
      PAPERLESS_OCR_LANGUAGES: eng+nld
      PAPERLESS_TIME_ZONE: Europe/Amsterdam
      PAPERLESS_ADMIN_USER: ${PAPERLESS_DEV_ADMIN_USER:-admin}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_DEV_ADMIN_PASSWORD:-admin}
      PAPERLESS_URL: http://localhost:8000
    healthcheck:
      test: curl -f http://localhost:8000 || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  postgres-data:
  paperless-data:
  paperless-media:
  paperless-export:
  paperless-consume:
  paperless-redis:
